<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Do you like me, sha?</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #ff758c, #ff7eb3, #fad0c4);
      overflow: hidden;
      flex-direction: column;
      text-align: center;
    }

    .page {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.8s ease forwards;
      width: 100%;
    }

    .active {
      display: flex;
    }

    h1 {
      font-size: 42px;
      color: #fff;
      margin-bottom: 30px;
      text-shadow: 2px 2px 5px rgba(0,0,0,0.2);
    }

    .emoji-row {
      font-size: 28px;
      margin-bottom: 15px;
    }

    .buttons {
      display: flex;
      gap: 20px;
      margin-bottom: 25px;
    }

    .yes-btn, .no-btn {
      border: none;
      padding: 18px 40px;
      font-size: 22px;
      font-weight: bold;
      border-radius: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }

    .yes-btn {
      background-color: #28a745;
      color: white;
    }

    .no-btn {
      background-color: #dc3545;
      color: white;
    }

    .yes-btn:hover {
      transform: scale(1.1);
      background-color: #218838;
    }

    .no-btn:hover {
      background-color: #c82333;
    }

    img {
      width: 200px;
      border-radius: 15px;
      margin-top: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Final Page */
    .final h1 {
      font-size: 46px;
      color: #fff;
      animation: pop 0.6s ease;
    }

    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .final img {
      width: 250px;
      margin-top: 20px;
    }

    /* Falling Hearts */
    .heart {
      position: fixed;
      top: -10px;
      font-size: 24px;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <!-- Page 1 -->
  <div id="page1" class="page active">
    <div class="emoji-row">🌸✨🥰💕😍✨🌸</div>
    <h1>Do you like me, sha? 💖</h1>
    <div class="emoji-row">💞😊💌🥺💘😘💞</div>

    <div class="buttons">
      <button class="yes-btn" id="yesBtn" onclick="sayYes()">Yes 🥰</button>
      <button class="no-btn" onclick="sayNo()">No 😢</button>
    </div>

    <img src="https://media.tenor.com/0AVbKGY_MxMAAAAj/love-cute.gif" alt="Cute dancing gif">
  </div>

  <!-- Page 2 -->
  <div id="page2" class="page final">
    <h1>Yay ❤️ I love you so much! 🥰💍💘</h1>
    <img src="https://media.tenor.com/bw8jj2dK7rYAAAAC/love-bear.gif" alt="Love bear gif">
  </div>

  <!-- Sounds -->
  <audio id="crySound" src="https://www.myinstants.com/media/sounds/sad-trombone.mp3"></audio>
  <audio id="happySound" src="https://www.myinstants.com/media/sounds/tuturu_1.mp3"></audio>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const page1 = document.getElementById("page1");
    const page2 = document.getElementById("page2");
    const crySound = document.getElementById("crySound");
    const happySound = document.getElementById("happySound");

    function sayYes() {
      page1.classList.remove("active");
      page1.style.display = "none";
      page2.classList.add("active");
      page2.style.display = "flex";
      happySound.play();
      spawnHearts();
    }

    function sayNo() {
      let currentSize = parseInt(window.getComputedStyle(yesBtn).fontSize);
      yesBtn.style.fontSize = (currentSize + 10) + "px";
      crySound.play();
    }

    function spawnHearts() {
      for (let i = 0; i < 20; i++) {
        let heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerText = "💖";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = (Math.random() * 3 + 2) + "s";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 5000);
      }
    }
  </script>
</body>
</html>
