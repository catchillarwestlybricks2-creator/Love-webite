<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Do you like me, sha?</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #ffe6f0;
      font-family: "Poppins", sans-serif;
      text-align: center;
    }

    h1 {
      font-size: 36px;
      color: #ff4d88;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }

    .yes-btn {
      font-size: 60px;
      padding: 25px 50px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .no-btn {
      font-size: 18px;
      padding: 12px 25px;
      background-color: #dc3545;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .page {
      display: none;
    }

    .active {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    img {
      margin-top: 25px;
      width: 200px;
      border-radius: 15px;
    }

    .final h1 {
      font-size: 40px;
      color: #ff1a75;
      animation: pop 0.7s ease;
    }

    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .final img {
      width: 250px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <!-- Page 1 -->
  <div id="page1" class="page active">
    <h1>Do you like me, sha? 💖</h1>
    <div class="buttons">
      <button class="yes-btn" id="yesBtn" onclick="sayYes()">Yes</button>
      <button class="no-btn" onclick="sayNo()">No</button>
    </div>
    <img src="https://media.tenor.com/0AVbKGY_MxMAAAAj/love-cute.gif" alt="Cute dancing gif">
  </div>

  <!-- Page 2 -->
  <div id="page2" class="page final">
    <h1>Yay ❤️ I love you so much!</h1>
    <img src="https://media.tenor.com/bw8jj2dK7rYAAAAC/love-bear.gif" alt="Love bear gif">
  </div>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const page1 = document.getElementById("page1");
    const page2 = document.getElementById("page2");

    function sayYes() {
      page1.classList.remove("active");
      page1.style.display = "none";
      page2.classList.add("active");
      page2.style.display = "flex";
    }

    function sayNo() {
      let currentSize = parseInt(window.getComputedStyle(yesBtn).fontSize);
      yesBtn.style.fontSize = (currentSize + 15) + "px";
      yesBtn.style.padding = "30px 60px";
    }
  </script>
</body>
</html>
